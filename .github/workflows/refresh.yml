name: Refresh market dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: write
  pages: write
concurrency: market-dashboard
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect.mjs
      - name: Publish snapshot to the existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh market data'
          git push
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
